# Temporary cross-platform verification. Delete after the run.
name: Glide cross-platform verification
on:
  push:
    branches:
      - chore/glide-reproducible-windows-linux-20261121

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify clean install
        run: npm ci
      - name: Verify portable launcher syntax
        run: node --check apps/teacher-ui/scripts/dev-glide.mjs
      - name: Smoke-test local editor startup
        shell: bash
        run: |
          npm run dev:glide > glide-smoke.log 2>&1 &
          editor_pid=$!
          trap 'kill "$editor_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:5173/ --output /dev/null &&
               curl --fail --silent http://127.0.0.1:7777/ --output /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          cat glide-smoke.log
          test "$ready" -eq 1
      - name: Build offline iPad version without editor
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:ipad:local
