name: Local iPad Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-ipad-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipad-local:
    name: Build Local iPad File
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint docs
        run: npm run lint:docs

      - name: Lint workflows
        run: npm run lint:workflows

      - name: OpenSSF readiness
        run: npm run lint:openssf

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build local iPad file
        run: npm run build:ipad:local

      - name: Verify single-file artifact
        run: |
          test -f release-artifacts/viccoboard.html
          test "$(find release-artifacts -type f | wc -l)" -eq 1

      - name: Upload local iPad artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viccoboard-local-ipad-${{ github.sha }}
          path: release-artifacts/viccoboard.html
          retention-days: 7
