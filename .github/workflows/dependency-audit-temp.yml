name: Temporary dependency audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/dependency-audit-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Inspect full and production npm advisories
        run: |
          npm audit --json --omit=dev > /tmp/audit-prod.json || true
          npm audit --json > /tmp/audit-all.json || true
          node -e '
            const fs = require("node:fs");
            for (const [scope, file] of [["production", "/tmp/audit-prod.json"], ["all", "/tmp/audit-all.json"]]) {
              const report = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!report.metadata?.vulnerabilities) throw new Error("Audit report unavailable: " + JSON.stringify(report.error));
              const entries = Object.entries(report.vulnerabilities || {}).map(([name, entry]) => ({
                name, severity: entry.severity, isDirect: entry.isDirect,
                via: entry.via.filter(v => typeof v === "object").map(v => v.name + ":" + (v.title || "advisory"))
              }));
              console.log(JSON.stringify({ scope, counts: report.metadata.vulnerabilities, details: entries }, null, 2));
            }
          '
