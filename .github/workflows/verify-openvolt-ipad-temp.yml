name: Verify OpenVolt iPad HTML (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-openvolt-ipad-temp.yml

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build standalone iPad HTML
        run: npm run build:ipad:local
      - name: Verify standalone bundle
        run: |
          test -s release-artifacts/viccoboard.html
          grep -q "student-list-page__header" release-artifacts/viccoboard.html
          du -h release-artifacts/viccoboard.html
