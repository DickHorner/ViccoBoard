# Temporary Windows 2022 runner verification; remove before opening PR.
name: Glide Windows 2022 smoke
on:
  push:
    branches:
      - chore/glide-reproducible-windows-linux-20261121
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Clean install
        run: npm ci
      - name: Portable launcher syntax
        run: node --check apps/teacher-ui/scripts/dev-glide.mjs
      - name: Editor startup (Vite 5173, Glide 7777)
        shell: bash
        run: |
          npm run dev:glide > glide-smoke.log 2>&1 &
          process_id=$!
          trap 'kill "$process_id" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5173/ -o /dev/null &&
               curl -fsS http://127.0.0.1:7777/ -o /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          cat glide-smoke.log
          test "$ready" -eq 1
