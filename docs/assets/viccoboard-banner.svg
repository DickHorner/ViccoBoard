<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">ViccoBoard — Erfassen. Beurteilen. Rueckmelden.</title>
  <desc id="description">Dunkles Titelmotiv mit abstrahierten Karten fuer Sportunterricht, Korrektur und lokale Datenhaltung.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1427"/>
      <stop offset="0.52" stop-color="#11273a"/>
      <stop offset="1" stop-color="#0d3441"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" x2="1">
      <stop offset="0" stop-color="#47e6c2"/>
      <stop offset="1" stop-color="#6fb8ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#40ddc7" stop-opacity=".30"/>
      <stop offset="1" stop-color="#40ddc7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#b9e0e1" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#02070f" flood-opacity=".40"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#background)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="946" cy="170" r="280" fill="url(#glow)"/>
  <path d="M0 319H1200" stroke="#8ce5db" stroke-opacity=".17"/>
  <path d="M65 70H94" stroke="#4ee6cb" stroke-width="5" stroke-linecap="round"/>
  <path d="M65 70V99" stroke="#4ee6cb" stroke-width="5" stroke-linecap="round"/>
  <rect x="65" y="117" width="160" height="28" rx="14" fill="#26515c"/>
  <text x="145" y="135" fill="#9bf7dd" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.4">TEACHER WORKSPACE</text>
  <text x="62" y="219" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="79" font-weight="800" letter-spacing="-3">Vicco<tspan fill="url(#highlight)">Board</tspan></text>
  <text x="67" y="259" fill="#c4e0e5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="2">ERFASSEN. BEURTEILEN. R&#220;CKMELDEN.</text>
  <text x="67" y="290" fill="#86acb7" font-family="Arial,Helvetica,sans-serif" font-size="16">Unterricht organisieren. Sport bewerten. Pr&#252;fungen korrigieren.</text>

  <g filter="url(#shadow)">
    <g transform="translate(742 56) rotate(-5 160 107)">
      <rect width="326" height="214" rx="19" fill="#192f47" stroke="#50778a" stroke-opacity=".67"/>
      <rect x="22" y="21" width="59" height="25" rx="12" fill="#215b60"/>
      <text x="51" y="38" fill="#8cf5d5" font-size="12" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">SPORT</text>
      <text x="23" y="83" fill="#f6ffff" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif">Messwert &#8594; Note</text>
      <rect x="23" y="108" width="280" height="1" fill="#3c5d71"/>
      <text x="23" y="135" fill="#bad9e0" font-size="13" font-family="Arial,Helvetica,sans-serif">Zeit  /  Strecke  /  Punkte</text>
      <rect x="23" y="153" width="170" height="11" rx="5" fill="#2f5b6c"/>
      <rect x="23" y="153" width="128" height="11" rx="5" fill="#4fe0c3"/>
      <rect x="23" y="175" width="212" height="9" rx="4" fill="#2a455b"/>
      <rect x="23" y="194" width="148" height="7" rx="3" fill="#2a455b"/>
    </g>
    <g transform="translate(940 134) rotate(6 101 86)">
      <rect width="210" height="168" rx="18" fill="#183851" stroke="#56809c"/>
      <rect x="19" y="20" width="49" height="24" rx="12" fill="#594b57"/>
      <text x="44" y="36" fill="#ffd8b8" font-size="12" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">KBR</text>
      <text x="19" y="79" fill="#f7fbff" font-size="19" font-weight="700" font-family="Arial,Helvetica,sans-serif">Korrigieren</text>
      <rect x="19" y="99" width="167" height="9" rx="4" fill="#3a6682"/>
      <rect x="19" y="119" width="130" height="9" rx="4" fill="#edaa83"/>
      <rect x="19" y="139" width="150" height="6" rx="3" fill="#3a6682"/>
    </g>
    <g transform="translate(718 260)">
      <rect width="213" height="58" rx="15" fill="#15413f" stroke="#399c8a"/>
      <circle cx="27" cy="28" r="13" fill="#2fcfa9"/>
      <path d="M22 28l4 4 7-8" fill="none" stroke="#0b3330" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="49" y="25" fill="#ecfff9" font-size="15" font-weight="700" font-family="Arial,Helvetica,sans-serif">Local-first</text>
      <text x="49" y="43" fill="#a0e4d2" font-size="12" font-family="Arial,Helvetica,sans-serif">Daten im Browser</text>
    </g>
  </g>
  <text x="67" y="340" fill="#8eb5bc" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="2">SPORT  /  KBR  /  LIVE TOOLS  /  LOCAL-FIRST</text>
</svg>
